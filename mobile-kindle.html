<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu della scuola</title>
<style>
* {
  box-sizing:border-box
}
html,body {
  margin:0;
  padding:0;
  background:#fff;
  color:#000;
  font-family:"Trebuchet MS",Arial,sans-serif
}
body {
  min-height:100vh;
  padding:12px
}
.page {
  max-width:1000px;
  margin:0 auto;
  border:5px solid #000
}
header {
  text-align:center;
  padding:18px 15px 15px;
  border-bottom:5px solid #000
}
.eyebrow {
  margin:0 0 6px;
  font-size:15px;
  font-weight:bold;
  letter-spacing:2px;
  text-transform:uppercase
}
h1 {
  margin:0;
  font-size:42px;
  line-height:1.1
}
.date-label {
  margin:10px 0 0;
  font-size:23px
}
.day-selector {
  display:table;
  width:100%;
  table-layout:fixed;
  border-bottom:3px solid #000
}
.day-button {
  display:table-cell;
  width:33.33%;
  height:55px;
  border:0;
  border-right:2px solid #000;
  background:#fff;
  color:#000;
  font-family:inherit;
  font-size:22px;
  font-weight:bold
}
.day-button:last-child {
  border-right:0
}
.day-button.active {
  background:#000;
  color:#fff
}
.menu-panel {
  padding:25px 28px 35px
}
.menu-heading {
  margin:0 0 20px;
  text-align:center;
  font-size:32px
}
.plates {
  width:fit-content;
  max-width:100%;
  margin:0 auto
}
.plate {
  margin:18px 0;
  font-size:34px;
  line-height:1.3;
  text-align:left
}
.plate-category {
  display:block;
  margin-bottom:2px;
  font-size:14px;
  font-weight:bold;
  letter-spacing:1px
}
.status {
  padding:35px 10px;
  text-align:center;
  font-size:24px;
  line-height:1.4
}
.status.error {
  font-weight:bold
}
.reload-button {
  display:block;
  margin:15px auto 0;
  padding:10px 18px;
  border:2px solid #000;
  background:#fff;
  color:#000;
  font-family:inherit;
  font-size:20px
}
.footer {
  padding:12px 10px 18px;
  text-align:center;
  font-size:14px
}
@media(max-width:600px) {
  body {
    padding:5px
  }
  .page {
    border-width:3px
  }
  header {
    padding:14px 8px;
    border-bottom-width:3px
  }
  h1 {
    font-size:30px
  }
  .date-label {
    font-size:18px
  }
  .day-button {
    height:48px;
    font-size:17px
  }
  .menu-panel {
    padding:18px 15px 25px
  }
  .menu-heading {
    font-size:25px
  }
  .plate {
    font-size:25px;
    margin:14px 0
  }
  .status {
    font-size:20px
  }
}
</style>
</head>
<body>
<main class="page">
<header><p class="eyebrow">Il menu del giorno</p><h1>Menu della scuola</h1><p class="date-label" id="dateLabel">Caricamento data...</p></header>
<nav class="day-selector"><button class="day-button" id="btnIeri" type="button">Ieri</button><button class="day-button active" id="btnOggi" type="button">Oggi</button><button class="day-button" id="btnDomani" type="button">Domani</button></nav>
<section class="menu-panel"><h2 class="menu-heading" id="menuHeading">Menu di oggi</h2><div class="plates" id="plates"><div class="status">Caricamento del menu...</div></div></section>
<footer class="footer">Menu scolastico aggiornato automaticamente.</footer>
</main>
<script>
/* Versione Kindle: usa XMLHttpRequest invece di fetch/async/await e evita API DOM moderne. */
var JSON_BASE="https://raw.githubusercontent.com/iletart/menu-scuola/main/";
var JSON_FILES={
  ieri:"menu-ieri.json",oggi:"menu.json",domani:"menu-domani.json"}
  ;
  var DAY_LABELS={
    ieri:"Menu di ieri",oggi:"Menu di oggi",domani:"Menu di domani"}
    ;
    var selectedDay="oggi";
    var platesElement=document.getElementById("plates"),dateLabel=document.getElementById("dateLabel"),menuHeading=document.getElementById("menuHeading");
    var btnIeri=document.getElementById("btnIeri"),btnOggi=document.getElementById("btnOggi"),btnDomani=document.getElementById("btnDomani");
    function pad(n){
      return n<10?"0"+n:String(n)}
      function getLocalDate(offset){
        var d=new Date();
        d.setHours(12,0,0,0);
        d.setDate(d.getDate()+offset);
        return d}
        function dateToISO(d){
          return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
          function getExpectedDate(day){
            var offsets={
              ieri:-1,oggi:0,domani:1}
              ;
              return dateToISO(getLocalDate(offsets[day]))}
              function formatDate(s){
                if(!s||!/^[0-9]{
                  4}
                  -[0-9]{
                    2}
                    -[0-9]{
                      2}
                      $/.test(s))return "";
                      var p=s.split("-"),d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]),12),w=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"],m=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
                      return w[d.getDay()]+" "+d.getDate()+" "+m[d.getMonth()]+" "+d.getFullYear()}
                      function clearElement(el){
                        while(el.firstChild)el.removeChild(el.firstChild)}
                        function showStatus(msg,error){
                          clearElement(platesElement);
                          var s=document.createElement("div");
                          s.className=error?"status error":"status";
                          s.appendChild(document.createTextNode(msg));
                          platesElement.appendChild(s);
                          if(error){
                            var b=document.createElement("button");
                            b.className="reload-button";
                            b.type="button";
                            b.appendChild(document.createTextNode("Riprova"));
                            b.onclick=function(){
                              loadMenu(selectedDay)}
                              ;
                              platesElement.appendChild(b)}
                            }
                            function normalize(s){
                              return String(s||"").toLowerCase()}
                              function classify(name){
                                var n=normalize(name);
                                if(/\b(pane|grissini|cracker)\b/.test(n))return "PANE";
                                if(/\b(frutta|mela|mele|pera|pere|banana|banane|arancia|arance|mandarino|mandarini|kiwi|pesca|pesche|albicocca|albicocche|uva|fragola|fragole|macedonia)\b/.test(n))return "FRUTTA";
                                if(/\b(pasta|riso|risotto|minestra|minestrone|zuppa|passato|brodo|orzo|farro|cous cous|couscous|gnocchi|lasagne|lasagna|tortellini|ravioli)\b/.test(n))return "PRIMO";
                                if(/\b(insalata|verdure|verdura|patate|carote|pomodori|finocchi|spinaci|bietole|zucchine|melanzane|fagiolini|piselli|cavolfiore|broccoli|contorno)\b/.test(n))return "CONTORNO";
                                if(/\bpizza\b/.test(n))return "PIATTO UNICO";
                                if(/\b(gelato|budino|yogurt|torta|dolce|dessert|sorbetto)\b/.test(n))return "DESSERT";
                                if(/\b(burger|hamburger|polpette|arrosto|pollo|tacchino|manzo|vitello|maiale|pesce|merluzzo|platessa|tonno|uova|frittata|formaggio|formaggi|mozzarella|ricotta|legumi|ceci|fagioli|lenticchie|bastoncini)\b/.test(n))return "SECONDO";
                                return "ALTRO"}
                                function renderMenu(data){
                                  clearElement(platesElement);
                                  if(!data||data.available===false){
                                    showStatus("Il menu per questo giorno non è disponibile.",false);
                                    return}
                                    if(!data.plates||!data.plates.length){
                                      showStatus("Non ci sono piatti disponibili per questo giorno.",false);
                                      return}
                                      var count=0;
                                      for(var i=0;
                                      i<data.plates.length;
                                      i++){
                                        var dish=data.plates[i];
                                        if(!dish||typeof dish!=="object")continue;
                                        var dishName=String(dish.name||"").replace(/^\s+|\s+$/g,"");
                                        if(!dishName)continue;
                                        count++;
                                        var plate=document.createElement("div");
                                        plate.className="plate";
                                        var cat=document.createElement("span");
                                        cat.className="plate-category";
                                        cat.appendChild(document.createTextNode(classify(dishName)));
                                        var name=document.createElement("div");
                                        name.appendChild(document.createTextNode(dishName));
                                        plate.appendChild(cat);
                                        plate.appendChild(name);
                                        platesElement.appendChild(plate)}
                                        if(count===0)showStatus("Non ci sono piatti disponibili per questo giorno.",false)}
                                        function loadMenu(day){
                                          selectedDay=day;
                                          btnIeri.className="day-button"+(day==="ieri"?" active":"");
                                          btnOggi.className="day-button"+(day==="oggi"?" active":"");
                                          btnDomani.className="day-button"+(day==="domani"?" active":"");
                                          menuHeading.innerHTML=DAY_LABELS[day];
                                          dateLabel.innerHTML=formatDate(getExpectedDate(day));
                                          showStatus("Caricamento del menu...",false);
                                          var request=new XMLHttpRequest();
                                          var url=JSON_BASE+JSON_FILES[day]+"?t="+new Date().getTime();
                                          request.open("GET",url,true);
                                          request.onreadystatechange=function(){
                                            if(request.readyState!==4)return;
                                            if(request.status>=200&&request.status<300){
                                              try{
                                                var data=JSON.parse(request.responseText);
                                                if(!data||typeof data!=="object")throw new Error("JSON non valido");
                                                if(data.date)dateLabel.innerHTML=formatDate(data.date)||formatDate(getExpectedDate(day));
                                                renderMenu(data)}
                                                catch(e){
                                                  showStatus("Errore nella lettura del menu.",true)}
                                                }
                                                else showStatus("Non riesco a caricare il menu.",true)}
                                                ;
                                                request.onerror=function(){
                                                  showStatus("Connessione non disponibile.",true)}
                                                  ;
                                                  request.send(null)}
                                                  btnIeri.onclick=function(){
                                                    loadMenu("ieri")}
                                                    ;
                                                    btnOggi.onclick=function(){
                                                      loadMenu("oggi")}
                                                      ;
                                                      btnDomani.onclick=function(){
                                                        loadMenu("domani")}
                                                        ;
                                                        loadMenu("oggi");
                                                        var lastDate=getExpectedDate("oggi");
                                                        setInterval(function(){
                                                          var d=getExpectedDate("oggi");
                                                          if(d!==lastDate){
                                                            lastDate=d;
                                                            loadMenu("oggi")}
                                                          }
                                                          ,60000);
</script>
</body>
</html>
