
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <title>Menu della scuola</title>

  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #20242b;
      --muted: #737b87;
      --accent: #287a57;
      --border: #e7e9ed;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    body.modal-open {
      overflow: hidden;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 5vw, 38px);
      line-height: 1.15;
    }

    .date-label {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .day-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 0 0 20px;
      padding: 5px;
      background: #e9ebef;
      border-radius: 15px;
    }

    .day-button {
      min-height: 44px;
      padding: 10px 6px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: #5d6470;
      font: inherit;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .day-button.active {
      background: #ffffff;
      color: var(--text);
      box-shadow: 0 1px 5px #00000012;
    }

    .menu-panel {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 4px 18px #1b253008;
    }

    .menu-heading {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: bold;
    }

    .plates {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .plate {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      min-width: 0;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #ffffff;
      color: var(--text);
      text-align: left;
      font: inherit;
    }

    .plate.clickable {
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease,
                  box-shadow 0.15s ease;
    }

    .plate.clickable:hover {
      transform: translateY(-1px);
      border-color: #c9d8cf;
      box-shadow: 0 3px 12px #0000000b;
    }

    .plate-icon {
      display: grid;
      place-items: center;
      flex: 0 0 46px;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: #f0f2f4;
      font-size: 24px;
    }

    .plate-content {
      flex: 1;
      min-width: 0;
    }

    .plate-category {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .plate-name {
      display: block;
      font-size: 15px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .plate-arrow {
      flex: 0 0 auto;
      margin-left: 2px;
      color: #8b929c;
      font-size: 27px;
      line-height: 1;
    }

    .plate[data-category="primo"] .plate-icon {
      background: #fff0dc;
    }

    .plate[data-category="secondo"] .plate-icon {
      background: #fbe8e4;
    }

    .plate[data-category="contorno"] .plate-icon {
      background: #e4f3e8;
    }

    .plate[data-category="frutta"] .plate-icon {
      background: #fff0d8;
    }

    .plate[data-category="pane"] .plate-icon {
      background: #f5e9d7;
    }

    .plate[data-category="unico"] .plate-icon {
      background: #ffe6d8;
    }

    .plate[data-category="dessert"] .plate-icon {
      background: #f1e7fb;
    }

    .plate[data-category="altro"] .plate-icon {
      background: #e8edf7;
    }

    .status {
      padding: 24px 12px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.error {
      color: #a12b2b;
    }

    .reload-button {
      display: block;
      margin: 12px auto 0;
      padding: 9px 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .footer {
      padding: 18px 5px 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    /* Finestra della foto del piatto */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #111820c9;
    }

    .modal.visible {
      display: flex;
    }

    .modal-box {
      position: relative;
      width: 100%;
      max-width: 620px;
      max-height: 90vh;
      overflow: auto;
      padding: 22px;
      border-radius: 20px;
      background: #ffffff;
      text-align: center;
      box-shadow: 0 15px 60px #00000040;
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 12px;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: #f0f1f3;
      color: #30343b;
      font-size: 26px;
      cursor: pointer;
    }

    .modal-title {
      margin: 8px 35px 18px;
      font-size: 21px;
      line-height: 1.35;
    }

    .modal-image {
      display: none;
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 12px;
    }

    .modal-placeholder {
      padding: 35px 10px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 20px 13px 30px;
      }

      header {
        margin-bottom: 20px;
      }

      .menu-panel {
        padding: 15px;
        border-radius: 17px;
      }

      .plate {
        gap: 11px;
        padding: 11px;
        border-radius: 13px;
      }

      .plate-icon {
        flex-basis: 42px;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        font-size: 22px;
      }

      .plate-name {
        font-size: 14px;
      }

      .modal {
        padding: 12px;
      }

      .modal-box {
        padding: 18px 13px;
        border-radius: 16px;
      }

      .modal-title {
        font-size: 18px;
      }

      .modal-image {
        max-height: 60vh;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header>
      <p class="eyebrow">Il menu del giorno</p>
      <h1>Menu della scuola</h1>
      <p class="date-label" id="dateLabel">Caricamento data...</p>
    </header>

    <nav class="day-selector" aria-label="Seleziona il giorno">
      <button class="day-button" type="button" data-day="ieri">Ieri</button>
      <button class="day-button active" type="button" data-day="oggi">Oggi</button>
      <button class="day-button" type="button" data-day="domani">Domani</button>
    </nav>

    <section class="menu-panel">
      <h2 class="menu-heading" id="menuHeading">Menu di oggi</h2>
      <div class="plates" id="plates">
        <div class="status">Caricamento del menu...</div>
      </div>
    </section>

    <footer class="footer">
      Menu scolastico aggiornato automaticamente.
    </footer>
  </main>

  <div class="modal" id="dishModal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true"
         aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" type="button"
              aria-label="Chiudi">&times;</button>
      <h2 class="modal-title" id="modalTitle"></h2>
      <img class="modal-image" id="modalImage" alt="">
      <div class="modal-placeholder" id="modalPlaceholder">
        Caricamento foto...
      </div>
    </div>
  </div>

  <script>
    "use strict";

    // File JSON già pubblicati sul repository GitHub.
    const JSON_BASE =
      "https://raw.githubusercontent.com/iletart/menu-scuola/main/";

    const JSON_FILES = {
      ieri: "menu-ieri.json",
      oggi: "menu.json",
      domani: "menu-domani.json"
    };

    const DAY_LABELS = {
      ieri: "Menu di ieri",
      oggi: "Menu di oggi",
      domani: "Menu di domani"
    };

    const platesElement = document.getElementById("plates");
    const dateLabel = document.getElementById("dateLabel");
    const menuHeading = document.getElementById("menuHeading");
    const dayButtons = document.querySelectorAll(".day-button");

    const modal = document.getElementById("dishModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalImage = document.getElementById("modalImage");
    const modalPlaceholder = document.getElementById("modalPlaceholder");
    const modalClose = document.getElementById("modalClose");

    let selectedDay = "oggi";
    let lastFocusedElement = null;

    // Usa la data locale del dispositivo, senza dipendere dal formato inglese.
    function getLocalDate(offsetDays) {
      const date = new Date();
      date.setHours(12, 0, 0, 0);
      date.setDate(date.getDate() + offsetDays);
      return date;
    }

    function formatDate(dateString) {
      if (!dateString || !/^\d{4}-\d{2}-\d{2}$/.test(dateString)) {
        return "";
      }

      const parts = dateString.split("-").map(Number);
      const date = new Date(parts[0], parts[1] - 1, parts[2], 12);

      return date.toLocaleDateString("it-IT", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    function getExpectedDate(day) {
      const offsets = {
        ieri: -1,
        oggi: 0,
        domani: 1
      };

      const date = getLocalDate(offsets[day]);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const dayNumber = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${dayNumber}`;
    }

    function normalizeDishName(name) {
      return String(name || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    // Classificazione indicativa basata sul nome restituito dall'API.
    function classifyDish(name) {
      const n = normalizeDishName(name);

      if (/\b(pane|grissini|cracker)\b/.test(n)) {
        return { label: "PANE", icon: "🥖", key: "pane" };
      }

      if (
        /\b(frutta|mela|mele|pera|pere|banana|banane|arancia|arance|mandarino|mandarini|kiwi|pesca|pesche|albicocca|albicocche|uva|fragola|fragole|macedonia)\b/.test(n)
      ) {
        return { label: "FRUTTA", icon: "🍎", key: "frutta" };
      }

      if (
        /\b(pasta|riso|risotto|minestra|minestrone|zuppa|passato|brodo|orzo|farro|cous cous|couscous|gnocchi|lasagne|lasagna|tortellini|ravioli)\b/.test(n)
      ) {
        return { label: "PRIMO", icon: "🍝", key: "primo" };
      }

      if (
        /\b(insalata|verdure|verdura|patate|carote|pomodori|finocchi|spinaci|bietole|zucchine|melanzane|fagiolini|piselli|cavolfiore|broccoli|contorno)\b/.test(n)
      ) {
        return { label: "CONTORNO", icon: "🥗", key: "contorno" };
      }

      if (/\bpizza\b/.test(n)) {
        return { label: "PIATTO UNICO", icon: "🍕", key: "unico" };
      }

      if (
        /\b(gelato|budino|yogurt|torta|dolce|dessert|sorbetto)\b/.test(n)
      ) {
        return { label: "DESSERT", icon: "🍨", key: "dessert" };
      }

      if (
        /\b(burger|hamburger|polpette|arrosto|pollo|tacchino|manzo|vitello|maiale|pesce|merluzzo|platessa|tonno|uova|frittata|formaggio|formaggi|mozzarella|ricotta|legumi|ceci|fagioli|lenticchie|bastoncini)\b/.test(n)
      ) {
        return { label: "SECONDO", icon: "🍽️", key: "secondo" };
      }

      return { label: "ALTRO", icon: "🍽️", key: "altro" };
    }

    function showStatus(message, isError) {
      platesElement.replaceChildren();

      const status = document.createElement("div");
      status.className = isError ? "status error" : "status";
      status.textContent = message;
      platesElement.appendChild(status);

      if (isError) {
        const retryButton = document.createElement("button");
        retryButton.type = "button";
        retryButton.className = "reload-button";
        retryButton.textContent = "Riprova";
        retryButton.addEventListener("click", function () {
          loadMenu(selectedDay);
        });
        platesElement.appendChild(retryButton);
      }
    }

    function renderMenu(data, day) {
      platesElement.replaceChildren();

      if (!data || data.available === false) {
        showStatus("Il menu per questo giorno non è disponibile.");
        return;
      }

      if (!Array.isArray(data.plates) || data.plates.length === 0) {
        showStatus("Non ci sono piatti disponibili per questo giorno.");
        return;
      }

      let displayedCount = 0;

      data.plates.forEach(function (dish) {
        if (!dish || typeof dish !== "object") {
          return;
        }

        const dishName = String(dish.name || "").trim();
        const dishCode = String(dish.dishCode || "").trim();

        if (!dishName) {
          return;
        }

        displayedCount++;

        const category = classifyDish(dishName);

        // Sul sito non sono disponibili foto per pane e frutta.
        const hasPhoto =
          Boolean(dishCode) &&
          category.key !== "frutta" &&
          category.key !== "pane";

        const plate = document.createElement("div");
        plate.className = "plate";
        plate.dataset.category = category.key;

        const icon = document.createElement("span");
        icon.className = "plate-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = category.icon;

        const content = document.createElement("div");
        content.className = "plate-content";

        const categoryLabel = document.createElement("span");
        categoryLabel.className = "plate-category";
        categoryLabel.textContent = category.label;

        const name = document.createElement("span");
        name.className = "plate-name";
        name.textContent = dishName;

        content.appendChild(categoryLabel);
        content.appendChild(name);

        plate.appendChild(icon);
        plate.appendChild(content);

        if (hasPhoto) {
          plate.classList.add("clickable");
          plate.setAttribute("role", "button");
          plate.setAttribute("tabindex", "0");
          plate.setAttribute("aria-label", "Mostra la foto: " + dishName);

          const arrow = document.createElement("span");
          arrow.className = "plate-arrow";
          arrow.setAttribute("aria-hidden", "true");
          arrow.textContent = "›";
          plate.appendChild(arrow);

          plate.addEventListener("click", function () {
            openModal(dishName, dishCode);
          });

          plate.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openModal(dishName, dishCode);
            }
          });
        }

        platesElement.appendChild(plate);
      });

      if (displayedCount === 0) {
        showStatus("Non ci sono piatti disponibili per questo giorno.");
      }
    }

    async function loadMenu(day) {
      selectedDay = day;

      dayButtons.forEach(function (button) {
        const active = button.dataset.day === day;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });

      menuHeading.textContent = DAY_LABELS[day];
      dateLabel.textContent = formatDate(getExpectedDate(day));
      showStatus("Caricamento del menu...", false);

      const url = JSON_BASE + JSON_FILES[day] + "?t=" + Date.now();

      try {
        const response = await fetch(url, { cache: "no-store" });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!data || typeof data !== "object") {
          throw new Error("Formato JSON non valido");
        }

        // Se il JSON contiene una data diversa, la mostriamo comunque
        // per non nascondere il menu disponibile.
        dateLabel.textContent =
          formatDate(data.date) || formatDate(getExpectedDate(day));

        renderMenu(data, day);
      } catch (error) {
        console.error("Errore caricamento menu:", error);
        showStatus(
          "Non riesco a caricare il menu. Controlla la connessione e riprova.",
          true
        );
      }
    }

    function openModal(dishName, dishCode) {
      lastFocusedElement = document.activeElement;

      modalTitle.textContent = dishName;
      modalImage.style.display = "none";
      modalPlaceholder.style.display = "block";
      modalPlaceholder.textContent = "Caricamento foto...";
      modalImage.removeAttribute("src");
      modalImage.alt = "Foto di " + dishName;

      modal.classList.add("visible");
      modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      modalClose.focus();

      if (!dishCode) {
        modalPlaceholder.textContent = "Foto non disponibile";
        return;
      }

      // PC: foto Large. Cellulare: foto Small.
      const prefix = window.matchMedia("(max-width: 600px)").matches
        ? "S_"
        : "L_";

      modalImage.onload = function () {
        modalImage.style.display = "block";
        modalPlaceholder.style.display = "none";
      };

      modalImage.onerror = function () {
        modalImage.style.display = "none";
        modalPlaceholder.style.display = "block";
        modalPlaceholder.textContent = "Foto non disponibile";
      };

      modalImage.src =
        "https://www.milanoristorazione.it/foto-piatti/" +
        prefix + dishCode + "-40.jpg";
    }

    function closeModal() {
      modal.classList.remove("visible");
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");

      modalImage.onload = null;
      modalImage.onerror = null;
      modalImage.removeAttribute("src");
      modalImage.style.display = "none";
      modalPlaceholder.style.display = "block";

      if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
        lastFocusedElement.focus();
      }
    }

    dayButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        loadMenu(button.dataset.day);
      });
    });

    modalClose.addEventListener("click", closeModal);

    modal.addEventListener("click", function (event) {
      if (event.target === modal) {
        closeModal();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && modal.classList.contains("visible")) {
        closeModal();
      }
    });

    // All'apertura mostra il menu di oggi.
    loadMenu("oggi");
  </script>
</body>
</html>
